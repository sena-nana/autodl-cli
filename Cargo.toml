[package]
name = "autodl-cli"
version = "0.1.0"
edition = "2024"
description = "A terminal-first, AI-agent-friendly CLI for AutoDL inspired by google-colab-cli"
license = "MIT OR Apache-2.0"

[[bin]]
name = "autodl"
path = "src/main.rs"

[lib]
name = "autodl_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
comfy-table = "7"
crossterm = "0.28"
directories = "6"
flate2 = "1"
ignore = "0.4"
indicatif = "0.17"
open = "5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "system-proxy"] }
rpassword = "7"
russh = { version = "0.54", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
